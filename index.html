<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { 
      margin: 0; padding: 0; 
      width: 100%;
      background: #ffffff; 
      overflow-x: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    
    #banner-topo { 
      width: 100%; display: none; 
      padding: 15px 0 5px 0; 
      text-align: center;
    }
    #banner-topo img { width: 92%; max-width: 600px; height: auto; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

    .arrasta-indicador {
      text-align: center; color: #888; font-size: 11px; font-weight: bold; margin-top: 15px;
      letter-spacing: 1px; animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateX(0);}
      40% {transform: translateX(5px);}
      60% {transform: translateX(3px);}
    }

    .swiper { width: 100%; height: 480px; background: #ffffff; margin-top: 10px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    .card { 
      border-radius: 15px; overflow: hidden; background: #ffffff; border: 1px solid #f0f0f0; 
      display: block; position: relative; box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .card img, .card video { height: 400px; width: auto; max-width: 95vw; display: block; object-fit: contain; background: #ffffff; }

    .link-indicator { 
      position: absolute; bottom: 15px; right: 15px; background: #25d366; color: #ffffff; 
      padding: 8px 14px; border-radius: 30px; font-size: 11px; font-weight: bold; z-index: 10;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-transform: uppercase; text-decoration: none;
    }

    /* Rodapé Ajustado */
    .footer-action {
      text-align: center;
      padding: 20px;
      background: #ffffff;
      color: #000;
    }
    .texto-patrocinio {
      font-size: 14px;
      margin-bottom: 15px;
      line-height: 1.4;
      padding: 0 20px;
    }
    .btn-whatsapp {
      display: inline-block;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
    
    @media (max-width: 600px) {
      .swiper { height: 430px; }
      .card img, .card video { height: 350px; }
    }
  </style>
</head>
<body>

  <div id="banner-topo"></div>
  
  <div class="arrasta-indicador">ARRASTA PARA O LADO ➔</div>

  <div class="swiper">
    <div class="swiper-wrapper" id="track"></div>
  </div>

  <div class="footer-action">
    <div class="texto-patrocinio">
        Seja um Patrocinador: Escolha um apresentador e divulgue sua empresa na Rádio e TV Nova Cotia.
    </div>
    <a href="https://radiocotiaapresentadores.smallbio.com.br/" target="_blank" class="btn-whatsapp">
        👉 FALAR COM UM APRESENTADOR
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const apiURL = "https://script.google.com/macros/s/AKfycbwgmjndCmGS7GP3mv9IwJ5BpaMnobXKyrZfyV5JwkmZqsdKuPnQ1yxYPOyWsrK6F2NG/exec";
    
    async function carregar() {
      try {
        const res = await fetch(apiURL);
        const dados = await res.json();
        if (!dados || dados.length === 0) return;

        if (dados[0].capa && dados[0].capa.includes("http")) {
            document.getElementById("banner-topo").innerHTML = `<img src="${dados[0].capa}">`;
            document.getElementById("banner-topo").style.display = "block";
        }

        document.getElementById("track").innerHTML = dados.map(item => {
          if(!item.arquivo) return '';
          const isVideo = /\.(mp4|webm|mov)$/i.test(item.arquivo);
          const temLink = item.link && item.link.length > 5;
          
          return `
            <div class="swiper-slide">
              <div class="card">
                ${isVideo 
                  ? `<video src="${item.arquivo}" controls playsinline></video>` 
                  : `<img src="${item.arquivo}">`}
                ${temLink ? `<a href="${item.link}" target="_blank" class="link-indicator">💬 CONTATO</a>` : ''}
              </div>
            </div>`;
        }).join('');

        new Swiper('.swiper', { 
          slidesPerView: 'auto', 
          spaceBetween: 25, 
          centeredSlides: true, 
          loop: dados.length > 1,
          grabCursor: true
        });
      } catch (e) { console.error("Erro:", e); }
    }
    carregar();
  </script>
</body>
</html>
