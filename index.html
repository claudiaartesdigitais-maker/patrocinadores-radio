<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { 
      margin: 0; padding: 0; 
      width: 100%;
      background: #001a33; 
      overflow-x: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    
    /* Espaçamentos do Banner - "Pula uma linha" antes e depois */
    #banner-topo { 
      width: 100%; display: none; 
      padding-top: 20px; 
      padding-bottom: 20px; 
      text-align: center;
    }
    #banner-topo img { width: 92%; max-width: 600px; height: auto; border-radius: 10px; }

    .header-container { background: #001a33; color: #ffcc00; text-align: center; padding: 12px 0; border-bottom: 2px solid #ffcc00; }
    .title { font-weight: bold; font-size: 19px; text-transform: uppercase; margin: 0; }
    
    /* Swiper (Carrossel) */
    .swiper { width: 100%; height: 480px; background: #001a33; margin-top: 5px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    .card { border-radius: 12px; overflow: hidden; background: #000; border: 1px solid #333; display: block; position: relative; }
    .card img, .card video { height: 400px; width: auto; max-width: 95vw; display: block; object-fit: contain; }

    /* BOTÃO WHATSAPP - Espaço azul reduzido no final */
    .footer-action {
      text-align: center;
      padding: 15px 0 25px 0; /* Espaço otimizado para não ficar gigante */
      background: #001a33;
    }
    .btn-whatsapp {
      display: inline-block;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: transform 0.2s;
    }
    .btn-whatsapp:active { transform: scale(0.95); }
    
    @media (max-width: 600px) {
      .swiper { height: 440px; }
      .card img, .card video { height: 360px; }
      .title { font-size: 17px; }
    }
  </style>
</head>
<body>
  <div id="banner-topo"></div>
  <div class="header-container"><div class="title">Patrocinadores</div></div>
  
  <div class="swiper">
    <div class="swiper-wrapper" id="track"></div>
  </div>

  <div class="footer-action">
    <a href="https://wa.me/5511997695479" target="_blank" class="btn-whatsapp">
       📱 FALE CONOSCO (SEJA PATROCINADOR)
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const apiURL = "https://script.google.com/macros/s/AKfycbwgmjndCmGS7GP3mv9IwJ5BpaMnobXKyrZfyV5JwkmZqsdKuPnQ1yxYPOyWsrK6F2NG/exec";
    async function carregar() {
      try {
        const res = await fetch(apiURL);
        const dados = await res.json();
        if (!dados || dados.length === 0) return;

        // Banner D2
        if (dados[0].capa) {
            document.getElementById("banner-topo").innerHTML = `<img src="${dados[0].capa}">`;
            document.getElementById("banner-topo").style.display = "block";
        }

        // Vídeos e Imagens
        document.getElementById("track").innerHTML = dados.map(item => {
          if(!item.arquivo) return '';
          const isVideo = /\.(mp4|webm|mov)$/i.test(item.arquivo);
          return `<div class="swiper-slide">
            <a href="${item.link || 'javascript:void(0)'}" target="_top" class="card">
              ${isVideo ? `<video src="${item.arquivo}" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>` : `<img src="${item.arquivo}">`}
            </a>
          </div>`;
        }).join('');

        new Swiper('.swiper', { slidesPerView: 'auto', spaceBetween: 20, centeredSlides: true, loop: true });
      } catch (e) { console.error(e); }
    }
    carregar();
  </script>
</body>
</html>
