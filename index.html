<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      background: transparent; 
      overflow: hidden; 
      font-family: sans-serif;
    }
    
    /* Container do Banner com espaço no topo (pular linha) */
    #banner-topo { 
      width: 100%; 
      display: none; 
      line-height: 0; 
      margin-top: 20px; /* Aqui pula a linha antes do banner */
    }
    #banner-topo img { width: 100%; height: auto; display: block; border-radius: 10px 10px 0 0; }

    /* Cabeçalho Ajustado */
    .header-container { 
      background: #001a33; 
      color: #ffcc00; 
      text-align: center; 
      padding: 10px 0; 
      border-bottom: 2px solid #ffcc00; 
    }
    .title { font-weight: bold; font-size: 16px; text-transform: uppercase; margin: 0; }
    .drag-instruction { font-size: 10px; color: #ffffff; margin-top: 2px; letter-spacing: 1px; font-weight: bold; animation: pulse 2s infinite; }
    
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    
    /* Área do Carrossel */
    .swiper { 
      width: 100%; 
      height: 380px; 
      padding-top: 15px; 
      background: #001a33; 
      border-radius: 0 0 10px 10px;
    }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    .card { 
      border-radius: 10px; 
      overflow: hidden; 
      background: #000; 
      border: 1px solid #333; 
      text-decoration: none; 
      display: block;
    }
    
    .card img, .card video { 
      height: 320px; 
      width: auto; 
      display: block; 
      object-fit: contain; 
    }
    
    .link-indicator { 
      position: absolute; 
      bottom: 10px; 
      right: 10px; 
      background: #ffcc00; 
      color: #001a33; 
      padding: 5px 10px; 
      border-radius: 5px; 
      font-size: 11px; 
      font-weight: 900; 
      z-index: 10; 
    }
  </style>
</head>
<body>

  <div id="banner-topo"></div>

  <div class="header-container">
    <div class="title">Patrocinadores</div>
    <div class="drag-instruction">&lt; ARRASTE PARA VER &gt;</div>
  </div>

  <div class="swiper">
    <div class="swiper-wrapper" id="track"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const apiURL = "https://script.google.com/macros/s/AKfycbwgmjndCmGS7GP3mv9IwJ5BpaMnobXKyrZfyV5JwkmZqsdKuPnQ1yxYPOyWsrK6F2NG/exec";

    async function carregar() {
      try {
        const res = await fetch(apiURL);
        const dados = await res.json();
        const track = document.getElementById("track");
        const bannerDiv = document.getElementById("banner-topo");
        
        if (!dados || dados.length === 0) return;

        if (dados[0].capa && dados[0].capa.trim() !== "") {
            bannerDiv.innerHTML = `<img src="${dados[0].capa}" alt="Banner">`;
            bannerDiv.style.display = "block";
        }

        track.innerHTML = dados.map(item => {
          if(!item.arquivo || !item.arquivo.includes("http")) return '';
          const isVideo = /\.(mp4|webm|mov)$/i.test(item.arquivo);
          return `
            <div class="swiper-slide">
              <a href="${item.link && item.link.length > 5 ? item.link : 'javascript:void(0)'}" target="_top" class="card">
                ${isVideo ? `<video src="${item.arquivo}" autoplay muted loop playsinline></video>` : `<img src="${item.arquivo}">`}
                ${item.link && item.link.length > 5 ? `<div class="link-indicator">📞 CONTATO</div>` : ''}
              </a>
            </div>`;
        }).join('');

        new Swiper('.swiper', {
          slidesPerView: 'auto',
          spaceBetween: 20,
          centeredSlides: true,
          loop: dados.length > 1,
          grabCursor: true
        });
      } catch (e) { console.error(e); }
    }
    carregar();
  </script>
</body>
</html>
