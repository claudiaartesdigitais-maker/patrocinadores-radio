<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    /* FUNDO BRANCO TOTAL */
    body, html { 
      margin: 0; padding: 0; 
      width: 100%;
      background: #ffffff; 
      overflow-x: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    
    /* Banner Superior */
    #banner-topo { 
      width: 100%; display: none; 
      padding: 15px 0 5px 0; 
      text-align: center;
    }
    #banner-topo img { 
      width: 92%; 
      max-width: 600px; 
      height: auto; 
      border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    /* INDICADOR DE ARRASTAR */
    .arrasta-indicador {
      text-align: center;
      color: #888;
      font-size: 12px;
      font-weight: bold;
      margin-top: 15px;
      letter-spacing: 1px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateX(0);}
      40% {transform: translateX(5px);}
      60% {transform: translateX(3px);}
    }
    
    /* Swiper (Carrossel) Manual */
    .swiper { 
      width: 100%; 
      height: 480px; 
      background: #ffffff; 
      margin-top: 5px; 
    }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    /* Card dos Patrocinadores - Estilo Clean */
    .card { 
      border-radius: 15px; 
      overflow: hidden; 
      background: #ffffff; 
      border: 1px solid #f0f0f0; 
      display: block; 
      position: relative; 
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    }
    .card img, .card video { 
      height: 400px; 
      width: auto; 
      max-width: 95vw; 
      display: block; 
      object-fit: contain; 
      background: #ffffff;
    }

    /* Etiqueta de Contato */
    .link-indicator { 
      position: absolute; 
      bottom: 15px; 
      right: 15px; 
      background: #25d366; 
      color: #ffffff; 
      padding: 8px 14px; 
      border-radius: 30px; 
      font-size: 11px; 
      font-weight: bold; 
      z-index: 10;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }

    /* Rodapé */
    .footer-action {
      text-align: center;
      padding: 10px 0 20px 0;
      background: #ffffff;
    }
    .btn-whatsapp {
      display: inline-block;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
      text-transform: uppercase;
    }

    /* BOTÃO DE SOM FIXO */
    #btn-audio-fixo {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      background: #4a148c;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    @media (max-width: 600px) {
      .swiper { height: 430px; }
      .card img, .card video { height: 350px; }
    }
  </style>
</head>
<body>

  <audio id="player-radio" preload="auto">
    <source src="LINK_DA_SUA_RADIO_AQUI" type="audio/mpeg">
  </audio>

  <button id="btn-audio-fixo" onclick="toggleSom()">
    <span id="icone-som">🔊</span> <span id="texto-som">OUVIR RÁDIO</span>
  </button>

  <div id="banner-topo"></div>

  <div class="arrasta-indicador">
     ARRASTA PARA O LADO ➔
  </div>
  
  <div class="swiper">
    <div class="swiper-wrapper" id="track"></div>
  </div>

  <div class="footer-action">
    <a href="https://wa.me/5511997695479" target="_blank" class="btn-whatsapp">
        📱 SEJA UM PATROCINADOR
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const apiURL = "https://script.google.com/macros/s/AKfycbwgmjndCmGS7GP3mv9IwJ5BpaMnobXKyrZfyV5JwkmZqsdKuPnQ1yxYPOyWsrK6F2NG/exec";
    
    function toggleSom() {
      const audio = document.getElementById("player-radio");
      const texto = document.getElementById("texto-som");
      const icone = document.getElementById("icone-som");

      if (audio.paused) {
        audio.play();
        texto.innerText = "PARAR RÁDIO";
        icone.innerText = "⏸️";
        document.getElementById("btn-audio-fixo").style.background = "#ff0000";
      } else {
        audio.pause();
        texto.innerText = "OUVIR RÁDIO";
        icone.innerText = "🔊";
        document.getElementById("btn-audio-fixo").style.background = "#4a148c";
      }
    }

    async function carregar() {
      try {
        const res = await fetch(apiURL);
        const dados = await res.json();
        if (!dados || dados.length === 0) return;

        if (dados[0].capa && dados[0].capa.includes("http")) {
            document.getElementById("banner-topo").innerHTML = `<img src="${dados[0].capa}">`;
            document.getElementById("banner-topo").style.display = "block";
        }

        document.getElementById("track").innerHTML = dados.map(item => {
          if(!item.arquivo) return '';
          const isVideo = /\.(mp4|webm|mov)$/i.test(item.arquivo);
          const temLink = item.link && item.link.length > 5;
          
          return `
            <div class="swiper-slide">
              <a href="${temLink ? item.link : 'javascript:void(0)'}" target="_blank" class="card">
                ${isVideo 
                  ? `<video src="${item.arquivo}" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>` 
                  : `<img src="${item.arquivo}">`}
                ${temLink ? `<div class="link-indicator">💬 CONTATO</div>` : ''}
              </a>
            </div>`;
        }).join('');

        new Swiper('.swiper', { 
          slidesPerView: 'auto', 
          spaceBetween: 25, 
          centeredSlides: true, 
          loop: dados.length > 1,
          grabCursor: true
        });
      } catch (e) { console.error("Erro:", e); }
    }
    carregar();
  </script>
</body>
</html>
