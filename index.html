<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    /* Reset total para evitar flutuação */
    body, html { 
      margin: 0; 
      padding: 0; 
      background: #001a33; /* Fundo escuro para combinar com o rádio */
      overflow: hidden; 
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    
    /* Container do Banner (D2) */
    #banner-topo { 
      width: 100%; 
      display: none; 
      line-height: 0; 
      background: #000;
    }
    #banner-topo img { 
      width: 100%; 
      height: auto; 
      display: block; 
    }

    /* Cabeçalho */
    .header-container { 
      background: #001a33; 
      color: #ffcc00; 
      text-align: center; 
      padding: 15px 0; 
      border-bottom: 3px solid #ffcc00; 
    }
    .title { font-weight: bold; font-size: 20px; text-transform: uppercase; margin: 0; letter-spacing: 1px; }
    .drag-instruction { font-size: 12px; color: #ffffff; margin-top: 5px; letter-spacing: 2px; font-weight: bold; animation: pulse 2s infinite; }
    
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    
    /* Área do Carrossel - Aumentada para não cortar */
    .swiper { 
      width: 100%; 
      height: 520px; /* Espaço generoso para o card + sombra */
      padding-top: 25px; 
      background: #001a33; 
    }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    /* Card dos Patrocinadores */
    .card { 
      position: relative; 
      border-radius: 15px; 
      overflow: hidden; 
      background: #000; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.7); 
      border: 1px solid #333; 
      text-decoration: none; 
      display: block;
      transition: transform 0.3s;
    }
    
    /* Ajuste de altura das imagens dos patrocinadores */
    .card img, .card video { 
      height: 420px; /* Aumentado para 420px */
      width: auto; 
      display: block; 
      object-fit: contain; 
    }
    
    .link-indicator { 
      position: absolute; 
      bottom: 20px; 
      right: 15px; 
      background: #ffcc00; 
      color: #001a33; 
      padding: 10px 18px; 
      border-radius: 10px; 
      font-size: 13px; 
      font-weight: 900; 
      z-index: 10; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="banner-topo"></div>

  <div class="header-container">
    <div class="title">Nossos Patrocinadores</div>
    <div class="drag-instruction">&lt; ARRASTE PARA
