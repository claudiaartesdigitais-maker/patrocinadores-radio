<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { 
      margin: 0; padding: 0; 
      width: 100%;
      background: #001a33; 
      overflow-x: hidden; /* Permite rolar apenas para baixo se necessário */
      font-family: sans-serif;
    }
    
    /* Banner GIF */
    #banner-topo { 
      width: 100%; display: none; 
      padding-top: 20px; 
      padding-bottom: 30px; 
      text-align: center;
    }
    #banner-topo img { width: 90%; max-width: 600px; height: auto; border-radius: 10px; }

    .header-container { background: #001a33; color: #ffcc00; text-align: center; padding: 15px 0; border-bottom: 3px solid #ffcc00; }
    .title { font-weight: bold; font-size: 22px; text-transform: uppercase; margin: 0; }
    
    /* Swiper - Altura dinâmica */
    .swiper { width: 100%; height: 550px; background: #001a33; margin-bottom: 50px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    .card { border-radius: 15px; overflow: hidden; background: #000; border: 1px solid #333; display: block; position: relative; }
    
    /* No computador o vídeo é um pouco menor para caber na tela, no celular ele se ajusta */
    .card img, .card video { 
      height: 450px; 
      width: auto; 
      max-width: 95vw; 
      display: block; 
      object-fit: contain; 
    }

    @media (max-width: 600px) {
      .swiper { height: 500px; }
      .card img, .card video { height: 400px; }
      .title { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div id="banner-topo"></div>
  <div class="header-container"><div class="title">Patrocinadores</div></div>
  <div class="swiper"><div class="swiper-wrapper" id="track"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const apiURL = "https://script.google.com/macros/s/AKfycbwgmjndCmGS7GP3mv9IwJ5BpaMnobXKyrZfyV5JwkmZqsdKuPnQ1yxYPOyWsrK6F2NG/exec";
    async function carregar() {
      try {
        const res = await fetch(apiURL);
        const dados = await res.json();
        if (!dados || dados.length === 0) return;

        if (dados[0].capa) {
            const b = document.getElementById("banner-topo");
            b.innerHTML = `<img src="${dados[0].capa}">`;
            b.style.display = "block";
        }

        document.getElementById("track").innerHTML = dados.map(item => {
          if(!item.arquivo || !item.arquivo.includes("http")) return '';
          const isVideo = /\.(mp4|webm|mov)$/i.test(item.arquivo);
          return `<div class="swiper-slide">
            <a href="${item.link && item.link.length > 5 ? item.link : 'javascript:void(0)'}" target="_top" class="card">
              ${isVideo 
                ? `<video src="${item.arquivo}" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>` 
                : `<img src="${item.arquivo}">`}
            </a>
          </div>`;
        }).join('');

        new Swiper('.swiper', { 
            slidesPerView: 'auto', 
            spaceBetween: 25, 
            centeredSlides: true, 
            loop: dados.length > 1,
            grabCursor: true 
        });
      } catch (e) { console.error(e); }
    }
    carregar();
  </script>
</body>
</html>
