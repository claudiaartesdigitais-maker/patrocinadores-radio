<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    body, html { 
      margin: 0; padding: 0; 
      width: 100%;
      background: #001a33; 
      overflow-x: hidden;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    
    /* Espaçamentos do Banner Superior */
    #banner-topo { 
      width: 100%; display: none; 
      padding-top: 15px; 
      padding-bottom: 20px; 
      text-align: center;
    }
    #banner-topo img { width: 90%; max-width: 600px; height: auto; border-radius: 10px; }

    /* Linha Dourada Divisora */
    .header-line { 
      width: 100%; 
      height: 2px; 
      background: #ffcc00; 
      margin-top: 5px;
    }
    
    /* Swiper (Carrossel) */
    .swiper { width: 100%; height: 480px; background: #001a33; margin-top: 15px; }
    .swiper-slide { display: flex; justify-content: center; align-items: center; width: auto; }
    
    .card { border-radius: 12px; overflow: hidden; background: #000; border: 1px solid #333; display: block; position: relative; }
    .card img, .card video { height: 400px; width: auto; max-width: 95vw; display: block; object-fit: contain; }

    /* ETIQUETA DE CONTATO (Lê o link da planilha) */
    .link-indicator { 
      position: absolute; 
      bottom: 15px; 
      right: 15px; 
      background: #ffcc00; 
      color: #001a33; 
      padding: 8px 12px; 
      border-radius: 8px; 
      font-size: 12px; 
      font-weight: 900; 
      z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    /* Seção do Botão de WhatsApp Geral */
    .footer-action {
      text-align: center;
      padding: 15px 0 10px 0;
      background: #001a33;
    }
    .btn-whatsapp {
      display: inline-block;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 25px;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    
    @media (max-width: 600px) {
      .swiper { height: 430px; }
      .card img, .card video { height: 350px; }
    }
  </style>
</head>
<body>

  <div id="banner-topo"></div>
  <div class="header-line"></div>
  
  <div class="swiper">
    <div class="swiper-wrapper" id="track"></div>
  </div>

  <div class="footer-action">
    <a href="https://wa.me/5511997695479" target="_blank" class="btn-whatsapp">
       📱 FALE CONOSCO (SEJA PATROCINADOR)
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    const apiURL = "https://script.google.com/macros/s/AKfycbwgmjndCmGS7GP3mv9IwJ5BpaMnobXKyrZfyV5JwkmZqsdKuPnQ1yxYPOyWsrK6F2NG/exec";
    
    async function carregar() {
      try {
        const res = await fetch(apiURL);
        const dados = await res.json();
        if (!dados || dados.length === 0) return;

        if (dados[0].capa && dados[0].capa.includes("http")) {
            document.getElementById("banner-topo").innerHTML = `<img src="${dados[0].capa}">`;
            document.getElementById("banner-topo").style.display = "block";
        }

        document.getElementById("track").innerHTML = dados.map(item => {
          if(!item.arquivo) return '';
          const isVideo = /\.(mp4|webm|mov)$/i.test(item.arquivo);
          const temLink = item.link && item.link.length > 5;
          
          return `
            <div class="swiper-slide">
              <a href="${temLink ? item.link : 'javascript:void(0)'}" target="_top" class="card">
                ${isVideo 
                  ? `<video src="${item.arquivo}" autoplay muted loop playsinline webkit-playsinline preload="auto"></video>` 
                  : `<img src="${item.arquivo}">`}
                ${temLink ? `<div class="link-indicator">📞 CONTATO</div>` : ''}
              </a>
            </div>`;
        }).join('');

        new Swiper('.swiper', { 
          slidesPerView: 'auto', 
          spaceBetween: 20, 
          centeredSlides: true, 
          loop: dados.length > 1,
          grabCursor: true 
        });
      } catch (e) { console.error("Erro:", e); }
    }
    carregar();
  </script>
</body>
</html>
